[package]
name = "leasetree"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "A pure state machine for distributed rate limits: shares of a rate handed down a spanning tree with a TTL. No IO, no clock."
repository = "https://github.com/kostja/leasetree"
homepage = "https://github.com/kostja/leasetree"
documentation = "https://docs.rs/leasetree"
readme = "README.md"
keywords = ["rate-limit", "lease", "quota", "distributed", "plumtree"]
categories = ["algorithms", "network-programming"]
authors = ["Konstantin Osipov <kostja.osipov@gmail.com>"]
